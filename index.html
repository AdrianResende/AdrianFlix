<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianFlix - Streaming de Filmes</title>
    <link rel="stylesheet" href="modern-ui-clean.css">
    <link rel="stylesheet" href="advanced-effects-clean.css">
    <style>
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #141414;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loading-logo {
            font-size: 60px;
            color: #e50914;
            font-weight: 700;
            margin-bottom: 30px;
            animation: logoFloat 2s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(229, 9, 20, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-progress {
            width: 0;
            height: 100%;
            background: #e50914;
            animation: loadingProgress 2s ease-in-out;
        }
        @keyframes loadingProgress {
            0% { width: 0; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">🎬 ADRIANFLIX</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div id="root"></div>

    <script src="modern-ui-clean.js"></script>
    <script>
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
        }, 2000);

        document.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            document.body.style.setProperty('--scroll-offset', `${scrolled * 0.5}px`);
            document.body.classList.toggle('scrolling', scrolled > 0);
        });
    </script>
</body>
</html>
