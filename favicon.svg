<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo circular gradiente vermelho Netflix -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b20710;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Letra A estilizada como um play button / filme -->
  <g fill="white">
    <!-- Triângulo play integrado com A -->
    <path d="M 30 30 L 30 70 L 45 50 Z" opacity="0.9"/>
    <!-- Letra A -->
    <path d="M 45 30 L 55 30 L 70 70 L 60 70 L 57 60 L 43 60 L 40 70 L 30 70 Z M 46 52 L 54 52 L 50 38 Z" />
    <!-- Detalhes de filme -->
    <rect x="35" y="25" width="3" height="8" opacity="0.7"/>
    <rect x="62" y="25" width="3" height="8" opacity="0.7"/>
  </g>
</svg>
